<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카카오톡 OX 퀴즈 10문제 | 어르신 스마트폰 교실</title>
<meta name="description" content="카카오톡 숨은 기능 OX 퀴즈 10문제. 로그인 없이 바로 풀 수 있는 큰 글씨 퀴즈입니다. O 또는 X를 눌러 보세요.">
<meta name="theme-color" content="#FFF7EC">
<meta property="og:type" content="website">
<meta property="og:title" content="카카오톡 OX 퀴즈 10문제">
<meta property="og:description" content="O와 X만 누르면 됩니다. 큰 글씨로 편하게 풀어 보세요.">
<meta property="og:image" content="https://yigoo29-gif.github.io/kakaotalk-ox-quiz/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect x='4' y='6' width='32' height='24' rx='10' fill='%23FFD9A8'/%3E%3Ccircle cx='15' cy='18' r='2.6' fill='%23C9601B'/%3E%3Ccircle cx='22' cy='18' r='2.6' fill='%23C9601B'/%3E%3C/svg%3E">
<style>
  :root{
    --cream:#FFF7EC;
    --card:#FFFFFF;
    --ink:#2B2118;
    --ink-soft:#5B4A38;
    --orange:#EF7C2A;
    --orange-deep:#C9601B;
    --orange-soft:#FFE7CE;
    --green:#1E7A50;
    --green-bg:#E9F6EF;
    --green-line:#8FD0AC;
    --red:#B93B31;
    --red-bg:#FDECE9;
    --red-line:#F1B5AD;
    --shadow:0 8px 22px rgba(96,60,24,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{font-size:20px}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Nanum Gothic",sans-serif;
    font-size:20px;
    line-height:1.6;
    -webkit-text-size-adjust:100%;
    padding-bottom:calc(28px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 16px}

  /* ---------- progress ---------- */
  header.top{
    position:sticky;top:0;z-index:10;
    background:rgba(255,247,236,.97);
    border-bottom:1px solid #F2E0C9;
    padding:12px 16px 10px;
    padding-top:calc(12px + env(safe-area-inset-top));
  }
  .top-in{max-width:560px;margin:0 auto}
  .top-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:900;color:var(--orange-deep);letter-spacing:-.02em}
  .brand svg{width:30px;height:30px;flex:none}
  .count{font-size:24px;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums}
  .count small{font-size:19px;font-weight:800;color:var(--ink-soft)}
  .bar{height:16px;border-radius:99px;background:#F6E3CC;margin-top:10px;overflow:hidden}
  .bar-fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#FFB876,var(--orange));transition:width .45s cubic-bezier(.2,.8,.2,1)}
  .bar-fill.done{background:linear-gradient(90deg,#7CC59B,var(--green))}

  /* ---------- question card ---------- */
  main{padding-top:18px}
  .card{
    background:var(--card);
    border:1px solid #F2E5D4;
    border-radius:28px;
    padding:18px 18px 24px;
    box-shadow:var(--shadow);
    animation:rise .34s ease both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .illust{display:flex;justify-content:center;margin:2px 0 6px}
  .illust svg{width:clamp(112px,30vw,140px);height:clamp(112px,30vw,140px)}
  .tag{display:block;text-align:center;font-size:17px;font-weight:800;color:var(--orange-deep);letter-spacing:.02em;margin-bottom:10px}
  .qtext{
    margin:0 0 22px;
    font-size:clamp(23px,6.3vw,29px);
    font-weight:900;
    line-height:1.52;
    letter-spacing:-.015em;
    word-break:keep-all;
    text-align:center;
  }
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .choice{
    position:relative;
    appearance:none;border:none;margin:0;padding:0;
    border-radius:24px;color:#fff;
    font-family:inherit;font-weight:900;
    font-size:clamp(50px,16vw,66px);
    height:clamp(120px,25vh,164px);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;touch-action:manipulation;
    transition:transform .1s ease,filter .2s ease,opacity .2s ease;
    box-shadow:0 7px 0 rgba(0,0,0,.16),0 12px 22px rgba(96,60,24,.18);
  }
  .choice.o{background:linear-gradient(165deg,#35A97A,#1B6E49)}
  .choice.x{background:linear-gradient(165deg,#D9564A,#AC3329)}
  .choice:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.16),0 6px 12px rgba(96,60,24,.18)}
  .choice:focus-visible{outline:5px solid #2B2118;outline-offset:4px}
  .choice .glyph{line-height:1}
  .choice.dim{filter:saturate(.5) brightness(.9);opacity:.5}
  .choice.correct{box-shadow:0 0 0 6px #FFD9A8,0 7px 0 rgba(0,0,0,.16),0 12px 22px rgba(96,60,24,.18);animation:pulse .5s ease}
  .choice.wrong{animation:shake .42s ease}
  .choice.correct::after,.choice.wrong::after{
    position:absolute;top:-14px;right:-10px;
    width:46px;height:46px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:26px;font-weight:900;color:#fff;
    box-shadow:0 4px 10px rgba(0,0,0,.2);
  }
  .choice.correct::after{content:"✓";background:#1E7A50}
  .choice.wrong::after{content:"✕";background:#B93B31}
  @keyframes pulse{0%{transform:scale(1)}45%{transform:scale(1.05)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

  /* ---------- feedback ---------- */
  .feedback{
    margin-top:18px;border-radius:26px;padding:20px 18px 22px;
    border:2px solid var(--green-line);background:var(--green-bg);
    animation:rise .3s ease both;
  }
  .feedback.bad{border-color:var(--red-line);background:var(--red-bg)}
  .fb-head{display:flex;align-items:center;gap:10px;font-size:clamp(22px,5.8vw,26px);font-weight:900;color:var(--green)}
  .feedback.bad .fb-head{color:var(--red)}
  .fb-head .icon{width:46px;height:46px;flex:none}
  .fb-right{margin-top:10px;font-size:21px;font-weight:900;color:var(--ink)}
  .fb-explain{
    margin-top:12px;background:#fff;border:1px dashed #E4D2B9;border-radius:18px;
    padding:15px 16px;font-size:20px;line-height:1.62;color:var(--ink-soft);word-break:keep-all;
  }
  .fb-explain b{color:var(--ink);font-weight:900}
  .next{
    width:100%;margin-top:16px;height:76px;border:none;border-radius:20px;
    background:var(--orange);color:#fff;font-family:inherit;font-size:26px;font-weight:900;
    box-shadow:0 7px 0 var(--orange-deep);cursor:pointer;touch-action:manipulation;
  }
  .next:active{transform:translateY(3px);box-shadow:0 4px 0 var(--orange-deep)}
  .next:focus-visible{outline:5px solid #2B2118;outline-offset:4px}

  /* ---------- result ---------- */
  .result{animation:rise .4s ease both}
  .result-card{
    background:#fff;border:1px solid #F2E5D4;border-radius:30px;
    padding:26px 20px 24px;text-align:center;box-shadow:var(--shadow);
  }
  .result-card .mascot{width:clamp(158px,46vw,212px);height:auto;margin:0 auto 6px;display:block;border-radius:26px}
  .result-title{font-size:clamp(24px,6.4vw,29px);font-weight:900;margin:6px 0 2px;word-break:keep-all}
  .score-line{margin:14px 0 4px}
  .score-num{font-size:clamp(60px,19vw,82px);font-weight:900;color:var(--orange);line-height:1;font-variant-numeric:tabular-nums}
  .score-sub{font-size:22px;font-weight:800;color:var(--ink-soft);margin-top:6px}
  .stamp{display:inline-block;margin-top:8px;padding:8px 18px;border-radius:99px;background:var(--orange-soft);color:var(--orange-deep);font-weight:900;font-size:20px}
  .msg{margin:18px 0 0;font-size:21px;line-height:1.66;color:var(--ink-soft);word-break:keep-all;text-align:center}
  .msg b{color:var(--ink)}
  .review{margin-top:20px;text-align:left;background:#FFFDF9;border:1px solid #F2E5D4;border-radius:20px;padding:14px 16px}
  .review h2{font-size:19px;margin:0 0 8px;color:var(--orange-deep);font-weight:900}
  .review ul{margin:0;padding-left:22px;font-size:18px;color:var(--ink-soft);line-height:1.6}
  .review li{margin:6px 0}
  .again{
    width:100%;margin-top:20px;height:80px;border:none;border-radius:22px;
    background:linear-gradient(165deg,#35A97A,#1B6E49);color:#fff;font-family:inherit;
    font-size:27px;font-weight:900;box-shadow:0 7px 0 #15583A;cursor:pointer;touch-action:manipulation;
  }
  .again:active{transform:translateY(3px);box-shadow:0 4px 0 #15583A}
  .again:focus-visible{outline:5px solid #2B2118;outline-offset:4px}
  .foot{text-align:center;font-size:17px;color:#9D8B77;margin:18px 0 0;line-height:1.5}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
  @media (max-width:340px){
    html{font-size:18px}
    .choices{gap:10px}
  }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="top-row">
      <span class="brand">
        <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="4" y="6" width="32" height="24" rx="10" fill="#FFD9A8"/><path d="M13 30l-2 7 9-7z" fill="#FFD9A8"/><circle cx="15" cy="18" r="2.4" fill="#C9601B"/><circle cx="22" cy="18" r="2.4" fill="#C9601B"/><path d="M18 23c1.6 1.6 4 1.6 5.6 0" stroke="#C9601B" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
        카카오톡 OX 퀴즈
      </span>
      <span class="count" id="count">1 <small>/ 10</small></span>
    </div>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
  </div>
</header>

<div class="wrap">
  <main id="quiz">
    <section class="card" id="card" aria-labelledby="qtext">
      <div class="illust" id="illust" aria-hidden="true"></div>
      <span class="tag" id="tag"></span>
      <p class="qtext" id="qtext"></p>
      <div class="choices" role="group" aria-label="정답을 고르세요">
        <button class="choice o" id="btnO" type="button" aria-label="오, 맞다">
          <span class="glyph" aria-hidden="true">O</span>
        </button>
        <button class="choice x" id="btnX" type="button" aria-label="엑스, 아니다">
          <span class="glyph" aria-hidden="true">X</span>
        </button>
      </div>
    </section>

    <section class="feedback" id="feedback" hidden aria-live="polite">
      <div class="fb-head">
        <svg class="icon" id="fbIcon" viewBox="0 0 48 48" aria-hidden="true"></svg>
        <span id="fbTitle"></span>
      </div>
      <p class="fb-right" id="fbRight"></p>
      <div class="fb-explain" id="fbExplain"></div>
      <button class="next" id="nextBtn" type="button">다음 문제</button>
    </section>
  </main>

  <section class="result" id="result" hidden aria-live="polite">
    <div class="result-card">
      <div id="mascot"></div>
      <h1 class="result-title" id="resultTitle"></h1>
      <div class="score-line">
        <div class="score-num"><span id="scoreNum">0</span><span style="font-size:.5em;font-weight:900;color:#5B4A38"> / 10</span></div>
        <div class="score-sub" id="scoreSub"></div>
      </div>
      <span class="stamp" id="stamp"></span>
      <p class="msg" id="msg"></p>
      <div class="review">
        <h2>오늘의 카카오톡 3가지</h2>
        <ul>
          <li>노란 전송 버튼을 <b>길게 꾹</b> — 조용히 보내기 · 스포 방지 · 메시지 예약</li>
          <li>보낸 메시지는 <b>24시간 안에</b> 고칠 수 있어요 (길게 눌러 수정)</li>
          <li>중요한 비밀번호는 <b>스포 방지</b>로 가려서 보내세요</li>
        </ul>
      </div>
      <button class="again" id="againBtn" type="button">처음부터 다시 풀기</button>
      <p class="foot">어르신 스마트폰 교실 · 카카오톡 OX 퀴즈</p>
    </div>
  </section>
</div>

<script>
(function(){
  "use strict";

  var C = {

      '<circle cx="60" cy="60" r="56" fill="'+C.bg+'"/>'+ inner +'</svg>';

  /* --- illustration set (inline SVG, no external files) --- */

  var ICON_OK = '<path d="M10 25l10 10 20-22" stroke="#2E8B57" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="24" cy="24" r="21" stroke="#8FD0AC" stroke-width="3" fill="#E9F6EF"/>';

  function setProgress(){
    var shown = Math.min(idx + 1, TOTAL);
    el.count.innerHTML = shown + ' <small>/ ' + TOTAL + '</small>';
    var pct = (idx / TOTAL) * 100;
    el.bar.style.width = Math.max(pct, 4) + '%';
    el.bar.classList.toggle('done', idx >= TOTAL);
  }

  function render(){
    var q = QUESTIONS[idx];
    el.illust.innerHTML = ART[q.art] || '';
    el.tag.textContent = '문제 ' + (idx + 1);
    el.qtext.textContent = q.q;
    el.btnO.className = 'choice o';
    el.btnX.className = 'choice x';
    el.btnO.disabled = false;
    el.btnX.disabled = false;
    el.feedback.hidden = true;
    el.feedback.className = 'feedback';
    el.card.style.animation = 'none';
    void el.card.offsetWidth;
    el.card.style.animation = '';
    setProgress();
    el.next.textContent = (idx === TOTAL - 1) ? '결과 보기' : '다음 문제';
    locked = false;
    window.scrollTo({top:0, behavior:'smooth'});
  }

  function answer(pick){
    if (locked) return;
    locked = true;
    var q = QUESTIONS[idx];
    var ok = pick === q.answer;
    if (ok) score++;
    picked[idx] = {ok:ok, q:q.q};

    el.btnO.disabled = true;
    el.btnX.disabled = true;
    var btnPick = pick === 'O' ? el.btnO : el.btnX;
    var btnRight = q.answer === 'O' ? el.btnO : el.btnX;
    btnRight.classList.add('correct');
    if (!ok) btnPick.classList.add('wrong');
    if (ok) btnPick.classList.add('correct');
    var other = q.answer === 'O' ? el.btnX : el.btnO;
    other.classList.add('dim');
    if (ok) { btnPick.classList.remove('dim'); }
    else { btnRight.classList.remove('dim'); }

    el.feedback.hidden = false;
    el.feedback.className = 'feedback' + (ok ? '' : ' bad');
    el.fbIcon.innerHTML = ok ? ICON_OK : ICON_NO;
    el.fbTitle.textContent = ok ? '딱 맞혔어요!' : '아쉬워요, 거의 다 왔어요';

    el.fbExplain.innerHTML = q.why;
    idx++;
    setProgress();
    if (navigator.vibrate) { try { navigator.vibrate(ok ? 24 : [18,60,18]); } catch(e){} }
    setTimeout(function(){
      el.feedback.scrollIntoView({behavior:'smooth', block:'nearest'});
    }, 120);
  }

      title = '괜찮아요, 다시 한 번!';

    }
    el.resultTitle.textContent = title;
    el.scoreSub.textContent = sub;
    el.stamp.textContent = stamp;
    el.msg.innerHTML = msg;
    el.bar.style.width = '100%';
    el.bar.classList.add('done');
    el.count.innerHTML = TOTAL + ' <small>/ ' + TOTAL + '</small>';
    window.scrollTo({top:0, behavior:'smooth'});
  }

  el.btnX.addEventListener('click', function(){ answer('X'); });

    if (idx >= TOTAL) { finish(); } else { render(); }

    idx = 0; score = 0; picked = [];

    el.quiz.hidden = false;
